name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  lower-bounds:
    name: Lower dependency bounds / Python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lower-bound dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy~=1.24.0" "scipy~=1.10.0" "cvxpy~=1.5.0" "pytest>=8,<9"
          python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine check-wheel-contents
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: |
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
      - name: Smoke-test the wheel
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/python examples/basic.py
      - name: Preserve distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
