name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify release tag matches package version
        run: >-
          python -c "import os, runpy; version = runpy.run_path('src/realtimebath/_version.py')['__version__'];
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}',
          f\"tag {os.environ['GITHUB_REF_NAME']!r} does not match package version {version!r}\""
      - name: Install test and packaging tools
        run: |
          python -m pip install --upgrade build twine check-wheel-contents
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: |
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
      - name: Smoke-test the wheel
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/python examples/basic.py
      - name: Preserve distributions for publishing
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/realtimebath
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
